<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="fav-body" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="35%" stop-color="#64748b" />
      <stop offset="75%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </radialGradient>
    <linearGradient id="fav-eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="#09090b"/>
  <!-- Ears -->
  <circle cx="10" cy="9.5" r="2.6" fill="#475569" />
  <circle cx="22" cy="9.5" r="2.6" fill="#475569" />
  <!-- Body -->
  <circle cx="16" cy="18" r="11" fill="url(#fav-body)"/>
  <!-- Top glow -->
  <ellipse cx="15" cy="10" rx="5" ry="2" fill="#cbd5e1" fill-opacity="0.5" />
  <!-- Cheeks -->
  <ellipse cx="9" cy="20.5" rx="1.8" ry="1.1" fill="#f43f5e" fill-opacity="0.3" />
  <ellipse cx="23" cy="20.5" rx="1.8" ry="1.1" fill="#f43f5e" fill-opacity="0.3" />
  <!-- Left Eye -->
  <ellipse cx="11.8" cy="17" rx="2.2" ry="2.8" fill="url(#fav-eye)" />
  <circle cx="11" cy="16" r="0.9" fill="#ffffff" />
  <!-- Right Eye -->
  <ellipse cx="20.2" cy="17" rx="2.2" ry="2.8" fill="url(#fav-eye)" />
  <circle cx="19.4" cy="16" r="0.9" fill="#ffffff" />
  <!-- Smile -->
  <path d="M14.6 20 Q16 21.3 17.4 20" fill="none" stroke="#1e293b" stroke-width="0.9" stroke-linecap="round" />
</svg>
