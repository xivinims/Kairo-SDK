name: Build FreeTumble PT-BR

on:
  push:
    branches: [game-library]
    paths:
      - "localizations/freetumble/**"
      - ".github/workflows/build-freetumble-ptbr.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    env:
      UPSTREAM_SHA: "f8b062d3e464ee9417444f84adf47313fa2fd016"
      RELEASE_TAG: "freetumble-ptbr-v1.1"

    steps:
      - name: Checkout Kaise localization
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Build SFML 2.6.2 compatibility runtime
        shell: msys2 {0}
        run: |
          git clone --branch 2.6.2 --depth 1 https://github.com/SFML/SFML.git sfml2-src
          cmake -S sfml2-src -B sfml2-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/sfml2-install" -DSFML_BUILD_EXAMPLES=OFF -DSFML_BUILD_DOC=OFF
          cmake --build sfml2-build --parallel 2
          cmake --install sfml2-build

      - name: Fetch original FreeTumble source
        shell: msys2 {0}
        run: |
          git clone https://github.com/akien-mga/freetumble.git upstream
          cd upstream
          git checkout "$UPSTREAM_SHA"
          cd ..
          cp localizations/freetumble/languages.h upstream/src/languages.h
          cp localizations/freetumble/GameMain.cpp upstream/src/gameEngine/GameMain.cpp
          cp localizations/freetumble/GfxEngine.cpp upstream/src/gfxEngine/GfxEngine.cpp
          sed -i 's/COMPONENTS Audio Graphics System Window/COMPONENTS audio graphics system window/' upstream/CMakeLists.txt
          sed -i 's/${SFML_LIBRARIES}/sfml-graphics sfml-window sfml-audio sfml-system/' upstream/CMakeLists.txt

      - name: Build Windows x64
        shell: msys2 {0}
        run: |
          cd upstream
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_PREFIX_PATH="$PWD/../sfml2-install" -DSFML_DIR="$PWD/../sfml2-install/lib/cmake/SFML" -DSFML_INCLUDE_DIR="$PWD/../sfml2-install/include" -DCMAKE_CXX_FLAGS="-I$PWD/../sfml2-install/include"
          cmake --build build --parallel 2
          test -f build/freetumble.exe

      - name: Assemble portable package
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          mkdir -p package
          cp upstream/build/freetumble.exe package/
          cp upstream/FreeSansBold.ttf package/
          cp upstream/reset_scores.dat package/
          cp upstream/LICENSE.txt package/
          cp upstream/README.md package/
          cp upstream/CHANGELOG.md package/

          for d in gfx music sfx skins tilesets; do
            cp -R "upstream/$d" package/
          done

          cp -n sfml2-install/bin/*.dll package/ || true
          export PATH="$PWD/sfml2-install/bin:$PATH"
          ldd upstream/build/freetumble.exe | awk '/ucrt64|sfml2-install/ {print $3}' | sort -u | while read -r dll; do
            [ -f "$dll" ] && cp -n "$dll" package/
          done

          for dll in package/*.dll; do
            ldd "$dll" 2>/dev/null | awk '/ucrt64/ {print $3}' | sort -u | while read -r dep; do
              [ -f "$dep" ] && cp -n "$dep" package/
            done
          done

          cat > package/TRADUCAO-PTBR.txt <<'TXT'
          FreeTumble 1.1 PT-BR - Kaise Games

          Baseado no código-fonte original:
          https://github.com/akien-mga/freetumble
          Commit: f8b062d3e464ee9417444f84adf47313fa2fd016

          Alterações:
          - Português (Brasil) adicionado como quarto idioma.
          - PT-BR selecionado por padrão na build Kaise.
          - seleção de PT_BR persistida no arquivo de configuração.

          Código e gráficos: GPLv3+.
          Música e efeitos mantêm as licenças e atribuições descritas no README original.

          Modificações disponíveis em:
          https://github.com/xivinims/Kairo-SDK/tree/game-library/localizations/freetumble

          Esta é uma build comunitária PT-BR e não uma release oficial do FreeTumble.
          TXT

          test -f package/freetumble.exe
          test -d package/gfx
          test -d package/music

      - name: Validate PT-BR strings in source
        shell: msys2 {0}
        run: |
          grep -q 'const int N_LANGUAGES=4' upstream/src/languages.h
          grep -q 'const int LANG_PT_BR=3' upstream/src/languages.h
          grep -q 'Português (Brasil)' upstream/src/languages.h
          grep -q 'LANG_PT_BR' upstream/src/gameEngine/GameMain.cpp
          grep -q 'language=LANG_PT_BR' upstream/src/gfxEngine/GfxEngine.cpp

      - name: Create ZIP and hash
        shell: pwsh
        run: |
          Compress-Archive -Path "package/*" -DestinationPath "FreeTumble-1.1-PTBR-Windows-x64.zip" -CompressionLevel Optimal
          $sha = (Get-FileHash "FreeTumble-1.1-PTBR-Windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          "$sha  FreeTumble-1.1-PTBR-Windows-x64.zip" | Set-Content "FreeTumble-1.1-PTBR-Windows-x64.zip.sha256" -Encoding ASCII

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeTumble-1.1-PTBR-Windows-x64
          path: |
            FreeTumble-1.1-PTBR-Windows-x64.zip
            FreeTumble-1.1-PTBR-Windows-x64.zip.sha256
          if-no-files-found: error

      - name: Publish isolated binary branch
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/freetumble-download"
          cp FreeTumble-1.1-PTBR-Windows-x64.zip "$RUNNER_TEMP/freetumble-download/"
          cp FreeTumble-1.1-PTBR-Windows-x64.zip.sha256 "$RUNNER_TEMP/freetumble-download/"

          git config user.name "Kaise Games Builder"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan download-freetumble
          git rm -rf .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp "$RUNNER_TEMP/freetumble-download/"* .

          cat > README.md <<'MD'
          # FreeTumble 1.1 PT-BR

          Build comunitária Windows x64 do FreeTumble 1.1 em Português (Brasil).

          Projeto original: https://github.com/akien-mga/freetumble

          Código e gráficos: GPLv3+.
          Demais atribuições permanecem conforme o README original.
          A tradução e automação de build estão na branch game-library deste repositório.

          Esta não é uma release oficial do FreeTumble.
          MD

          git add .
          git commit -m "publish: FreeTumble 1.1 PT-BR Windows x64"
          git push --force origin HEAD:download-freetumble
