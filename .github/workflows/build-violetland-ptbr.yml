name: Build Violetland PT-BR

on:
  push:
    branches: [game-library]
    paths:
      - "localizations/violetland/**"
      - ".github/workflows/build-violetland-ptbr.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    env:
      GAME_VERSION: "0.5"
      RELEASE_TAG: "violetland-ptbr-v0.5"

    steps:
      - name: Checkout Kaise localization
        uses: actions/checkout@v4

      - name: Setup MSYS2 build environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-SDL
            mingw-w64-x86_64-SDL_image
            mingw-w64-x86_64-SDL_ttf
            mingw-w64-x86_64-SDL_mixer
            mingw-w64-x86_64-gettext
            mingw-w64-x86_64-pkgconf

      - name: Fetch original Violetland source
        shell: msys2 {0}
        run: |
          git clone --recurse-submodules --branch "$GAME_VERSION" --depth 1 https://github.com/ooxi/violetland.git upstream
          cp localizations/violetland/pt_BR.po upstream/po/pt_BR.po

      - name: Build original game with PT-BR
        shell: msys2 {0}
        run: |
          cd upstream
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DLOCALE_INSTALL_DIR=locale
          cmake --build build --parallel 2
          test -f build/violetland.exe
          msgfmt --check --check-format po/pt_BR.po -o pt_BR.mo

      - name: Assemble portable Windows package
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          mkdir -p package
          cp upstream/build/violetland.exe package/
          cp upstream/start.cmd package/
          cp upstream/README.md package/
          cp upstream/README_RU.TXT package/
          cp upstream/LICENSE.CODE package/
          cp upstream/LICENSE.ASSETS package/
          cp upstream/icon-light.png package/

          for d in fonts sounds images monsters weapon music; do
            cp -R "upstream/$d" package/
          done

          mkdir -p package/locale/pt_BR/LC_MESSAGES
          cp upstream/pt_BR.mo package/locale/pt_BR/LC_MESSAGES/violetland.mo

          ldd upstream/build/violetland.exe | awk '/mingw64/ {print $3}' | sort -u | while read -r dll; do
            [ -f "$dll" ] && cp -n "$dll" package/
          done

          printf '%s\r\n' '@echo off' 'cd /d "%~dp0"' 'set LANG=pt_BR.UTF-8' 'set LANGUAGE=pt_BR' 'violetland.exe' > package/INICIAR-VIOLETLAND-PTBR.cmd

          cat > package/TRADUCAO-PTBR.txt <<'TXT'
          Violetland 0.5 PT-BR - Kaise Games

          Compilado a partir do código-fonte original do tag 0.5:
          https://github.com/ooxi/violetland/tree/0.5

          Alteração:
          - catálogo gettext pt_BR completo
          - 114/114 mensagens traduzidas
          - placeholders de formatação preservados

          Código: GNU GPL v3
          Assets: Creative Commons BY-SA 3.0

          Tradução e automação da build:
          https://github.com/xivinims/Kairo-SDK/tree/game-library/localizations/violetland

          Esta é uma build comunitária PT-BR e não uma release oficial do Violetland.
          TXT

          test -f package/violetland.exe
          test -f package/locale/pt_BR/LC_MESSAGES/violetland.mo

      - name: Smoke-check package structure
        shell: msys2 {0}
        run: |
          ls -lh package/violetland.exe
          msgunfmt package/locale/pt_BR/LC_MESSAGES/violetland.mo | grep -c '^msgid ' | tee translated-entry-count.txt
          find package -maxdepth 1 -iname '*.dll' | wc -l

      - name: Create release ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "package/*" -DestinationPath "Violetland-0.5-PTBR-Windows-x64.zip" -CompressionLevel Optimal
          $sha = (Get-FileHash "Violetland-0.5-PTBR-Windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          "$sha  Violetland-0.5-PTBR-Windows-x64.zip" | Set-Content "Violetland-0.5-PTBR-Windows-x64.zip.sha256" -Encoding ASCII

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Violetland-0.5-PTBR-Windows-x64
          path: |
            Violetland-0.5-PTBR-Windows-x64.zip
            Violetland-0.5-PTBR-Windows-x64.zip.sha256
            translated-entry-count.txt
          if-no-files-found: error

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @"
          # Violetland 0.5 PT-BR

          Build Windows x64 compilada a partir do código-fonte original do Violetland 0.5.

          - 114/114 mensagens traduzidas para Português (Brasil).
          - Placeholders validados com gettext.
          - Código-fonte da modificação disponível na branch game-library.
          - Código original sob GPL-3.0.
          - Assets sob CC BY-SA 3.0.

          Projeto original: https://github.com/ooxi/violetland

          Esta não é uma release oficial do Violetland.
          "@ | Set-Content RELEASE_NOTES.md -Encoding UTF8

          if (gh release view "$env:RELEASE_TAG" *> $null) {
            gh release upload "$env:RELEASE_TAG" "Violetland-0.5-PTBR-Windows-x64.zip" "Violetland-0.5-PTBR-Windows-x64.zip.sha256" --clobber
          } else {
            gh release create "$env:RELEASE_TAG" "Violetland-0.5-PTBR-Windows-x64.zip" "Violetland-0.5-PTBR-Windows-x64.zip.sha256" --title "Violetland 0.5 PT-BR" --notes-file RELEASE_NOTES.md --target "$env:GITHUB_SHA"
          }
